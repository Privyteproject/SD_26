<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champs — Synapse Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F4ECDC;--surface:#FBF6EC;--ink:#2D2114;--muted:#6E5C46;--line:#E6D8BF;
    --gold:#B8893E;--gold-deep:#946B2A;--field:#FFF;--danger:#B4402E}
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',sans-serif}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:600;margin:0 0 18px}
  .form{max-width:460px;display:flex;flex-direction:column;gap:14px}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px}
  .field{height:40px;width:100%;border:1px solid var(--line);background:var(--field);color:var(--ink);
    border-radius:9px;padding:0 12px;font-size:14px;font-family:inherit;outline:none}
  .field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,62,.18)}
  textarea.field{height:auto;min-height:84px;padding:10px;resize:vertical}
  .err{border-color:var(--danger)}
  .errtxt{color:var(--danger);font-size:12px;margin-top:4px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold)}
  input[type=range]{width:100%;accent-color:var(--gold)}
</style></head>
<body>
  <h1 class="font-display">Champs de formulaire</h1>
  <div class="form">
    <div><label>Texte</label><input class="field" placeholder="Rechercher un collaborateur…"></div>
    <div><label>Focus (état actif)</label><input class="field" style="border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,137,62,.18)" value="Marine Ferrand"></div>
    <div><label>Liste déroulante</label><select class="field"><option>Confirmé</option><option>Senior</option></select></div>
    <div><label>Zone de texte</label><textarea class="field" placeholder="Quelques mots sur vous…"></textarea></div>
    <div><label>Erreur</label><input class="field err" value="date invalide"><div class="errtxt">Les dates sont incohérentes.</div></div>
    <label class="check"><input type="checkbox" checked> Garder mon commentaire anonyme</label>
    <div><label>Curseur d'avancement — 65%</label><input type="range" min="0" max="100" value="65"></div>
  </div>
</body></html>
